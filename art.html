<!DOCTYPE html>

<body>
<!-- Adding playful elements for background decorations -->
<div class="playful-bg" aria-hidden="true">
    <span class="bg-star star-one">✦</span>
    <span class="bg-star star-two">✧</span>
    <span class="bg-star star-three">✦</span>
    <span class="bg-code code-one">&lt;/&gt;</span>
    <span class="bg-code code-two">./</span>
    <span class="bg-code code-three">{ }</span>
    <span class="bg-planet planet-one"></span>
    <span class="bg-planet planet-two"></span>
    <span class="pacman"></span>
    <span class="pellets"></span>
    <span class="pixel-ghost">▟▙</span>
    <span class="shooting-star"></span>
</div>

<header>
    <nav class="navbar navbar-expand-lg fixed-top custom-navbar" aria-label="Art gallery navigation">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">Nafisa Tabassum</a>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-2">
                    <li class="nav-item"><a class="nav-link" href="index.html#home">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="index.html#about">About</a></li>
                    <li class="nav-item"><a class="nav-link" href="index.html#skills">Skills</a></li>

                    <li class="nav-item"><a class="nav-link" href="index.html#beyond">Beyond Tech</a></li>
                    <li class="nav-item"><a class="nav-link" href="index.html#contact">Contact</a></li>
                    <li class="nav-item">
                        <a class="nav-link back-link" href="index.html#beyond">
                            <i class="fa-solid fa-arrow-left"></i> Back
                        </a>
                    </li>
                </ul>
            </div>
            <div class="nav-controls">
                <!-- Adding small screen back button for responsiveness -->
                <a href="index.html#beyond" class="mobile-back-link" aria-label="Back to Beyond Tech section">
                    <i class="fa-solid fa-arrow-left" aria-hidden="true"></i>
                    <span>Back</span>
                </a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                        aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <!-- theme toggle button. Updated: to sleepy/wake-up character theme toggle -->
                <button id="themeToggle" class="theme-toggle-btn" type="button" aria-label="Switch Theme">
                    <span class="toggle-sky" aria-hidden="true"></span>
                    <span class="toggle-moon" aria-hidden="true"></span>
                    <span class="toggle-sun" aria-hidden="true"></span>
                    <span class="toggle-character" aria-hidden="true">
                        <span class="toggle-face"></span>
                    </span>
                    <span class="toggle-z" aria-hidden="true">zZ</span>
                    <span class="visually-hidden">Switch theme</span>
                </button>
            </div>

        </div>
    </nav>
</header>

                    A collection of my artwork, exploring different styles and ideas.
                </p>
